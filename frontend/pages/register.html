<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="Create your private CompanionAI account."
>

<title>Create account — CompanionAI</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">

</head>

<body>

<header class="header">

<div class="header-inner">

    <a href="../index.html" class="brand">
        <span class="brand-icon">✦</span>
        <span>CompanionAI</span>
    </a>

    <nav class="nav">

        <a href="../index.html">
            Home
        </a>

        <button
            id="themeToggle"
            class="icon-button"
            type="button"
            aria-label="Toggle theme"
        >
            ◐
        </button>

    </nav>

</div>

</header>

<main class="auth-page">

<div class="auth-container">

    <section class="auth-card">

        <div class="auth-brand">

            <div class="auth-brand-icon">
                ✦
            </div>

            <h1>
                Create your space
            </h1>

            <p>
                Start with a private CompanionAI account.
            </p>

        </div>


        <form
            id="registerForm"
            class="auth-form"
            novalidate
        >

            <div class="form-group">

                <label for="registerName">
                    Name
                </label>

                <input
                    id="registerName"
                    name="name"
                    type="text"
                    autocomplete="name"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    id="registerEmail"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        id="registerPassword"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="password-wrapper">

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Create account
            </button>


            <div
                id="registerMessage"
                class="form-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>


        <div class="auth-links">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </div>

    </section>

</div>

</main>

<script src="../js/app.js"></script>

<script src="../js/auth.js"></script>

</body>
</html>
